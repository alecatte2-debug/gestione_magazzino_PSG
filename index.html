<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestione Magazzini</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  .wh-root, .wh-login-wrap {
    --ink: #1C2321;
    --paper: #F6F5F0;
    --paper-2: #ECEAE2;
    --steel: #46536A;
    --amber: #E0932F;
    --amber-deep: #B96F1C;
    --green: #4C7A57;
    --rust: #B5533C;
    --line: #DAD5C8;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
  }
  html, body { margin: 0; padding: 0; }
  .wh-display { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: 0.01em; text-transform: uppercase; font-size: 28px; margin: 2px 0 0; }
  .wh-display-sm { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 20px; margin: 0; }
  .wh-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--steel); margin: 0 0 2px; }
  .wh-mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .wh-dim { color: var(--steel); font-size: 13px; }
  .wh-strong { font-weight: 600; }

  * { box-sizing: border-box; }

  .wh-login-wrap { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wh-login-card { position: relative; width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 32px 28px 28px; box-shadow: 0 20px 50px -20px rgba(28,35,33,0.25); overflow: hidden; }
  .wh-badge-strip { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: repeating-linear-gradient(90deg, var(--ink) 0 10px, var(--amber) 10px 20px); }
  .wh-login-head { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .wh-login-icon { width: 42px; height: 42px; border-radius: 4px; background: var(--ink); color: var(--amber); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .wh-login-sub { color: var(--steel); font-size: 13.5px; line-height: 1.5; margin: 14px 0 22px; }
  .wh-login-form { display: flex; flex-direction: column; gap: 14px; }
  .wh-field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
  .wh-field span { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--steel); font-weight: 500; }
  .wh-field input, .wh-field select { font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; width: 100%; }
  .wh-field input:focus, .wh-field select:focus { border-color: var(--amber-deep); box-shadow: 0 0 0 3px rgba(224,147,47,0.18); }
  .wh-login-error { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--rust); background: rgba(181,83,60,0.08); border: 1px solid rgba(181,83,60,0.25); padding: 8px 10px; border-radius: 3px; }
  .wh-login-submit { justify-content: center; margin-top: 4px; width: 100%; }

  .wh-btn { display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px; padding: 9px 16px; border-radius: 3px; border: 1px solid transparent; cursor: pointer; transition: transform .1s, background .15s, border-color .15s; }
  .wh-btn:active { transform: translateY(1px); }
  .wh-btn:disabled { opacity: 0.6; cursor: default; }
  .wh-btn-primary { background: var(--ink); color: #fff; }
  .wh-btn-primary:hover { background: #2b332f; }
  .wh-btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .wh-btn-ghost:hover { background: var(--paper-2); }
  .wh-btn-danger { background: var(--rust); color: #fff; }
  .wh-btn-danger:hover { background: #9a422f; }
  .wh-submit-move.stamp-in { border-left: 4px solid var(--green); }
  .wh-submit-move.stamp-out { border-left: 4px solid var(--rust); }
  .wh-submit-move.stamp-mid { border-left: 4px solid var(--steel); }
  .wh-spin { animation: wh-spin 0.9s linear infinite; }
  @keyframes wh-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .wh-spin { animation: none; } }

  .wh-topbar { display: flex; align-items: center; gap: 20px; padding: 14px 24px; background: var(--ink); color: #fff; flex-wrap: wrap; }
  .wh-topbar-left { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .wh-logo-mark { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; background: var(--amber); color: var(--ink); width: 34px; height: 34px; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
  .wh-topbar .wh-eyebrow { color: #C9C2AF; }
  .wh-user-line { font-size: 13.5px; font-weight: 600; margin: 0; }
  .wh-nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .wh-nav-btn { display: flex; align-items: center; gap: 7px; background: transparent; border: 1px solid transparent; color: #D9D5C8; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 3px; cursor: pointer; transition: background .15s, color .15s; }
  .wh-nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .wh-nav-btn.active { background: var(--amber); color: var(--ink); }
  .wh-topbar .wh-btn-ghost { border-color: rgba(255,255,255,0.25); color: #fff; }
  .wh-topbar .wh-btn-ghost:hover { background: rgba(255,255,255,0.08); }

  .wh-main { padding: 28px 24px 60px; max-width: 1100px; margin: 0 auto; }
  .wh-view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .wh-view-sub { color: var(--steel); font-size: 13.5px; margin: 8px 0 0; max-width: 520px; line-height: 1.5; }

  .wh-summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .wh-summary-card { background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--amber); border-radius: 3px; padding: 16px 18px; }
  .wh-summary-number { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; margin: 4px 0 2px; }
  .wh-summary-number span { font-size: 14px; font-weight: 500; color: var(--steel); text-transform: lowercase; font-family: 'Inter', sans-serif; }
  .wh-summary-sub { font-size: 12.5px; color: var(--steel); margin: 0; }

  .wh-searchbar { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 9px 12px; margin-bottom: 16px; max-width: 380px; color: var(--steel); }
  .wh-searchbar input { border: none; outline: none; background: transparent; font-size: 13.5px; width: 100%; color: var(--ink); }
  .wh-filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .wh-filters select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; background: #fff; font-size: 13px; font-family: 'Inter', sans-serif; }

  .wh-table-wrap { background: #fff; border: 1px solid var(--line); border-radius: 3px; overflow-x: auto; }
  .wh-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
  .wh-table th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--steel); font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--paper-2); white-space: nowrap; }
  .wh-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .wh-table tr:last-child td { border-bottom: none; }
  .wh-num { text-align: right; }
  .wh-qty-low { color: var(--rust); font-weight: 700; }
  .wh-low-icon { color: var(--rust); margin-left: 4px; vertical-align: middle; }
  .wh-empty { text-align: center; color: var(--steel); padding: 28px; }
  .wh-row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .wh-icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; color: var(--ink); }
  .wh-icon-btn:hover { background: var(--paper-2); }
  .wh-icon-danger:hover { border-color: var(--rust); color: var(--rust); }

  .stamp { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px; padding: 3px 9px; border: 2px dashed; border-radius: 3px; transform: rotate(-2deg); }
  .stamp-in { color: var(--green); border-color: var(--green); }
  .stamp-out { color: var(--rust); border-color: var(--rust); }
  .stamp-mid { color: var(--steel); border-color: var(--steel); }

  .wh-type-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .wh-type-tab { display: flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 3px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--steel); }
  .wh-type-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .wh-movement-card { background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 22px; max-width: 620px; }
  .wh-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .wh-field-wide { grid-column: 1 / -1; }
  .wh-stock-hint { margin: 16px 0; font-size: 12.5px; color: var(--steel); background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 9px 12px; }
  .wh-modal-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

  .wh-modal-overlay { position: fixed; inset: 0; background: rgba(28,35,33,0.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .wh-modal { background: #fff; border-radius: 4px; padding: 24px; width: 100%; max-width: 460px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4); }
  .wh-modal-sm { max-width: 400px; }
  .wh-modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .wh-modal-msg { font-size: 13.5px; color: var(--steel); line-height: 1.5; margin: 0 0 20px; }

  .wh-toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 3px; display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 500; box-shadow: 0 12px 30px -8px rgba(0,0,0,0.4); z-index: 60; border-left: 3px solid var(--green); }
  .wh-toast-error { border-left-color: var(--rust); }

  .wh-center-panel { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 60px 20px; color: var(--steel); }

  @media (max-width: 640px) {
    .wh-form-grid { grid-template-columns: 1fr; }
    .wh-view-head { align-items: flex-start; }
    .wh-summary-number { font-size: 24px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict';

/* ------------------------------------------------------------------
   CONFIGURAZIONE SUPABASE
------------------------------------------------------------------- */
var SUPABASE_URL = 'https://eggzhfalndxviflmenyq.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_fxKhT0eUF--5eoL9mDQ-1g_pwD5pkhI';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtDate(ts) {
  return new Date(ts).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtEuro(n) { return '€ ' + Number(n || 0).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

var MOVE_TYPES = {
  carico: { label: 'Carico', cls: 'stamp-in' },
  scarico: { label: 'Scarico', cls: 'stamp-out' },
  trasferimento: { label: 'Trasferimento', cls: 'stamp-mid' },
};

var ICONS = {
  login: ["M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4", "M10 17l5-5-5-5", "M15 12H3"],
  logout: ["M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4", "M16 17l5-5-5-5", "M21 12H9"],
  box: ["M21 8l-9-5-9 5 9 5 9-5z", "M3 8v8l9 5 9-5V8", "M12 13v8"],
  boxes: ["M12 3l4 2-4 2-4-2 4-2z", "M8 7v4l4 2 4-2V7", "M4 9l4 2v4l-4-2z", "M20 9l-4 2v4l4-2z"],
  swap: ["M7 3 3 7l4 4", "M3 7h13", "M17 21l4-4-4-4", "M21 17H8"],
  packagePlus: ["M21 8l-9-5-9 5 9 5 9-5z", "M3 8v8l9 5 9-5V8", "M12 13v3", "M16.5 16.5h3", "M18 15v3"],
  packageMinus: ["M21 8l-9-5-9 5 9 5 9-5z", "M3 8v8l9 5 9-5V8", "M12 13v3", "M16.5 16.5h3"],
  history: ["M3 3v6h6", "M3 9a9 9 0 1 0 3-6.7", "M12 7v5l4 2"],
  search: ["M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z", "M21 21l-4.35-4.35"],
  plus: ["M12 5v14", "M5 12h14"],
  pencil: ["M12 20h9", "M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"],
  trash: ["M3 6h18", "M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2", "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"],
  warning: ["M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z", "M12 9v4", "M12 17h.01"],
  x: ["M18 6 6 18", "M6 6l12 12"],
  check: ["M20 6 9 17l-5-5"],
  loader: ["M12 2v4", "M12 18v4", "M4.93 4.93l2.83 2.83", "M16.24 16.24l2.83 2.83", "M2 12h4", "M18 12h4", "M4.93 19.07l2.83-2.83", "M16.24 7.76l2.83-2.83"],
  key: ["M21 2 19 4", "M7.5 15.5A5.5 5.5 0 1 0 12 6a5.5 5.5 0 0 0-4.5 9.5Z", "M11.5 11.5 4 19v3h3l7.5-7.5", "M15 15l4 4"],
  chevronRight: ["M9 18l6-6-6-6"],
};

function icon(name, size, cls) {
  size = size || 16; cls = cls || '';
  var paths = (ICONS[name] || []).map(function (d) { return '<path d="' + d + '"/>'; }).join('');
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + cls + '">' + paths + '</svg>';
}

/* ------------------------------------------------------------------
   STATO GLOBALE
------------------------------------------------------------------- */
var state = {
  authChecked: false,
  user: null,
  db: null,
  dbError: '',
  view: 'dashboard',
  toast: null,
  dashQuery: '',
  prodQuery: '',
  movementType: 'carico',
  movementCart: [],
  historyFilterType: 'tutti',
  historyFilterWarehouse: 'tutti',
  editingProduct: null,   // null | 'new' | product object
  confirmDeleteProduct: null,
  returningLoan: null,    // null | { note, warehouseId, items: [{productId,name,sku,qty}] }
  loginError: '',
  loginBusy: false,
};

var root = document.getElementById('root');

/* ------------------------------------------------------------------
   CARICAMENTO DATI
------------------------------------------------------------------- */
function loadAll() {
  return Promise.all([
    sb.from('warehouses').select('*').order('id'),
    sb.from('products').select('*').order('name'),
    sb.from('inventory').select('*'),
    sb.from('movements').select('*').order('ts', { ascending: false }).limit(500),
  ]).then(function (results) {
    var wh = results[0], prod = results[1], inv = results[2], mov = results[3];
    var firstError = wh.error || prod.error || inv.error || mov.error;
    if (firstError) throw firstError;

    var inventory = {};
    inv.data.forEach(function (r) {
      if (!inventory[r.product_id]) inventory[r.product_id] = {};
      inventory[r.product_id][r.warehouse_id] = Number(r.qty);
    });
    var products = prod.data.map(function (p) {
      return { id: p.id, sku: p.sku, name: p.name, category: p.category, price: Number(p.price), minStock: Number(p.min_stock), totalOwned: Number(p.total_owned || 0) };
    });
    var movements = mov.data.map(function (m) {
      return {
        id: m.id, ts: new Date(m.ts).getTime(), type: m.type, user: m.user_email,
        productId: m.product_id, productName: m.product_name, productSku: m.product_sku,
        from: m.from_warehouse, to: m.to_warehouse, qty: Number(m.qty), note: m.note,
      };
    });
    state.db = { warehouses: wh.data, products: products, inventory: inventory, movements: movements };
    state.dbError = '';
  }).catch(function (e) {
    console.error(e);
    state.dbError = 'Impossibile caricare i dati dal database. Controlla la connessione o le policy di Supabase.';
  }).then(render);
}

function showToast(msg, kind) {
  state.toast = { msg: msg, kind: kind || 'ok', id: uid() };
  render();
  setTimeout(function () {
    if (state.toast && state.toast.id === (state.toast || {}).id) { state.toast = null; render(); }
  }, 3200);
}

/* ------------------------------------------------------------------
   AZIONI SUL DATABASE
------------------------------------------------------------------- */
function applyCarico(productId, warehouseId, qty, note) {
  var product = state.db.products.find(function (p) { return p.id === productId; });
  var current = (state.db.inventory[productId] || {})[warehouseId] || 0;
  return sb.from('inventory').upsert({ product_id: productId, warehouse_id: warehouseId, qty: current + qty })
    .then(function (r) { if (r.error) throw r.error;
      return sb.from('movements').insert({
        id: uid(), type: 'carico', user_email: state.user.email, product_id: productId,
        product_name: product.name, product_sku: product.sku, from_warehouse: null, to_warehouse: warehouseId, qty: qty, note: note,
      });
    }).then(function (r) { if (r.error) throw r.error; });
}

function applyScarico(productId, warehouseId, qty, note) {
  var product = state.db.products.find(function (p) { return p.id === productId; });
  var current = (state.db.inventory[productId] || {})[warehouseId] || 0;
  if (qty > current) return Promise.reject(new Error(product.name + ': giacenza insufficiente (disponibili ' + current + ')'));
  return sb.from('inventory').upsert({ product_id: productId, warehouse_id: warehouseId, qty: current - qty })
    .then(function (r) { if (r.error) throw r.error;
      return sb.from('movements').insert({
        id: uid(), type: 'scarico', user_email: state.user.email, product_id: productId,
        product_name: product.name, product_sku: product.sku, from_warehouse: warehouseId, to_warehouse: null, qty: qty, note: note,
      });
    }).then(function (r) { if (r.error) throw r.error; });
}

function applyTrasferimento(productId, fromId, toId, qty, note) {
  if (fromId === toId) return Promise.reject(new Error('Seleziona due magazzini diversi'));
  var product = state.db.products.find(function (p) { return p.id === productId; });
  var current = (state.db.inventory[productId] || {})[fromId] || 0;
  if (qty > current) return Promise.reject(new Error(product.name + ': giacenza insufficiente nell\'origine (disponibili ' + current + ')'));
  var currentTo = (state.db.inventory[productId] || {})[toId] || 0;
  return sb.from('inventory').upsert([
    { product_id: productId, warehouse_id: fromId, qty: current - qty },
    { product_id: productId, warehouse_id: toId, qty: currentTo + qty },
  ]).then(function (r) { if (r.error) throw r.error;
    return sb.from('movements').insert({
      id: uid(), type: 'trasferimento', user_email: state.user.email, product_id: productId,
      product_name: product.name, product_sku: product.sku, from_warehouse: fromId, to_warehouse: toId, qty: qty, note: note,
    });
  }).then(function (r) { if (r.error) throw r.error; });
}

function doCarico(productId, warehouseId, qty, note) {
  var product = state.db.products.find(function (p) { return p.id === productId; });
  return applyCarico(productId, warehouseId, qty, note)
    .then(function () { return loadAll(); })
    .then(function () { showToast('Carico registrato: +' + qty + ' ' + product.name); })
    .catch(function (e) { console.error(e); showToast('Errore nel salvataggio del carico.', 'error'); });
}

function doScarico(productId, warehouseId, qty, note) {
  var product = state.db.products.find(function (p) { return p.id === productId; });
  var current = (state.db.inventory[productId] || {})[warehouseId] || 0;
  if (qty > current) { showToast('Giacenza insufficiente: disponibili solo ' + current + ' unità', 'error'); return Promise.resolve(); }
  return applyScarico(productId, warehouseId, qty, note)
    .then(function () { return loadAll(); })
    .then(function () { showToast('Scarico registrato: -' + qty + ' ' + product.name); })
    .catch(function (e) { console.error(e); showToast('Errore nel salvataggio dello scarico.', 'error'); });
}

function doTrasferimento(productId, fromId, toId, qty, note) {
  var product = state.db.products.find(function (p) { return p.id === productId; });
  return applyTrasferimento(productId, fromId, toId, qty, note)
    .then(function () { return loadAll(); })
    .then(function () { showToast('Trasferite ' + qty + ' unità di ' + product.name); })
    .catch(function (e) { console.error(e); showToast('Errore nel salvataggio del trasferimento.', 'error'); });
}

function submitMovementBatch(lines, type, endpoints, note) {
  var errors = [];
  var chain = Promise.resolve();
  lines.forEach(function (line) {
    chain = chain.then(function () {
      var p;
      if (type === 'carico') p = applyCarico(line.productId, endpoints.warehouseId, line.qty, note);
      else if (type === 'scarico') p = applyScarico(line.productId, endpoints.warehouseId, line.qty, note);
      else p = applyTrasferimento(line.productId, endpoints.fromId, endpoints.toId, line.qty, note);
      return p.catch(function (e) { errors.push(e.message || String(e)); });
    });
  });
  return chain.then(function () { return loadAll(); }).then(function () {
    var okCount = lines.length - errors.length;
    if (okCount > 0) showToast(okCount + ' moviment' + (okCount === 1 ? 'o' : 'i') + ' registrat' + (okCount === 1 ? 'o' : 'i') + (errors.length ? ', ' + errors.length + ' con errori' : ''), errors.length ? 'error' : 'ok');
    if (errors.length) console.error('Errori nel movimento batch:', errors);
    if (okCount === 0 && errors.length) showToast(errors[0], 'error');
    return errors;
  });
}

function upsertProduct(product, stockOverrides) {
  var isNew = !state.db.products.some(function (p) { return p.id === product.id; });
  return sb.from('products').upsert({
    id: product.id, sku: product.sku, name: product.name, category: product.category, price: product.price, min_stock: product.minStock, total_owned: product.totalOwned,
  }).then(function (r) {
    if (r.error) throw r.error;
    var rows = state.db.warehouses.map(function (w) {
      var qty = (stockOverrides && stockOverrides[w.id] !== undefined) ? stockOverrides[w.id] : 0;
      return { product_id: product.id, warehouse_id: w.id, qty: qty };
    });
    return sb.from('inventory').upsert(rows);
  }).then(function () { return loadAll(); })
    .then(function () { showToast(isNew ? 'Prodotto aggiunto' : 'Prodotto aggiornato'); })
    .catch(function (e) { console.error(e); showToast('Errore nel salvataggio del prodotto.', 'error'); });
}

function deleteProduct(productId) {
  return sb.from('products').delete().eq('id', productId)
    .then(function (r) { if (r.error) throw r.error; return loadAll(); })
    .then(function () { showToast('Prodotto eliminato'); })
    .catch(function (e) { console.error(e); showToast("Errore nell'eliminazione del prodotto.", 'error'); });
}

function doLogin() {

  }).catch(function () {

    state.loginError = 'Errore di connessione. Riprova.';
    render();
  });

function doLogout() {
  sb.auth.signOut();
}

sb.auth.getSession().then(function (r) {
  state.authChecked = true;
  if (r.data.session) state.user = { email: r.data.session.user.email };
  render();
  if (state.user) loadAll();
});

sb.auth.onAuthStateChange(function (_event, session) {
  var wasLogged = !!state.user;
  state.user = session ? { email: session.user.email } : null;
  if (state.user && !wasLogged) { loadAll(); }
  if (!state.user) { state.db = null; state.view = 'dashboard'; render(); }
});

/* ------------------------------------------------------------------
   PRESTITI APERTI (raggruppati per nota/causale)
------------------------------------------------------------------- */
function computeOpenLoans() {
  var db = state.db;
  var groups = {}; // note -> { note, warehouseId, items: { productId: {name, sku, outQty, inQty} } }
  db.movements.forEach(function (m) {
    if (!m.note) return;
    if (m.type === 'scarico') {
      var g = groups[m.note];
      if (!g) g = groups[m.note] = { note: m.note, warehouseId: m.from, items: {} };
      var it = g.items[m.productId] || (g.items[m.productId] = { productId: m.productId, name: m.productName, sku: m.productSku, outQty: 0, inQty: 0 });
      it.outQty += m.qty;
    } else if (m.type === 'carico') {
      var g2 = groups[m.note];
      if (g2 && g2.warehouseId === m.to && g2.items[m.productId]) {
        g2.items[m.productId].inQty += m.qty;
      }
    }
  });
  var result = [];
  Object.keys(groups).forEach(function (note) {
    var g = groups[note];
    var items = Object.keys(g.items).map(function (pid) { return g.items[pid]; })
      .map(function (it) { return { productId: it.productId, name: it.name, sku: it.sku, outstanding: it.outQty - it.inQty }; })
      .filter(function (it) { return it.outstanding > 0; });
    if (items.length) result.push({ note: g.note, warehouseId: g.warehouseId, items: items });
  });
  return result;
}

      '<div class="wh-summary-card" style="margin-bottom:10px;">' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">' +
      '<div><p class="wh-eyebrow">' + esc(whName(loan.warehouseId)) + '</p><p class="wh-strong" style="margin:2px 0 8px;">' + esc(loan.note) + '</p>' +
      '<ul style="margin:0; padding-left:18px; font-size:13px; color:var(--steel);">' + itemsList + '</ul></div>' +
      '<button type="button" class="wh-btn wh-btn-primary wh-submit-move stamp-in" data-return-loan="' + esc(loan.note) + '">' + icon('packagePlus', 16) + ' Registra reso</button>' +
      '</div></div>'
    );
  }).join('');
  return (
    '<div class="wh-view" style="margin-bottom:26px;">' +
    viewHeader('In corso', 'Prestiti aperti', 'Uscite non ancora rientrate, raggruppate per nota. Il reso torna automaticamente nel magazzino di origine.') +
    cards +
    '</div>'
  );
}

function returnModalHtml() {
  var loan = state.returningLoan;
  if (!loan) return '';
  var rows = loan.items.map(function (it, i) {
    return '<tr><td class="wh-strong">' + esc(it.name) + '</td>' +
      '<td class="wh-num"><input class="wh-mono" data-return-qty="' + i + '" type="number" min="0" value="' + it.qty + '" style="width:80px; padding:6px 8px; border:1px solid var(--line); border-radius:3px; text-align:right;" /></td>' +
      '<td class="wh-row-actions"><button class="wh-icon-btn wh-icon-danger" data-remove-return-line="' + i + '">' + icon('x', 14) + '</button></td></tr>';
  }).join('');
  return (
    '<div class="wh-modal-overlay" id="return-modal-overlay"><div class="wh-modal">' +
    '<div class="wh-modal-head"><h2 class="wh-display-sm">Registra reso</h2><button class="wh-icon-btn" id="return-close">' + icon('x', 16) + '</button></div>' +
    '<p class="wh-modal-msg">Causale: <span class="wh-strong">' + esc(loan.note) + '</span>. Puoi correggere le quantità (es. reso parziale) prima di confermare.</p>' +
    '<div class="wh-table-wrap" style="margin-bottom:16px;"><table class="wh-table"><tbody>' + rows + '</tbody></table></div>' +
    '<div class="wh-modal-actions"><button type="button" class="wh-btn wh-btn-ghost" id="return-cancel">Annulla</button>' +
    '<button type="button" class="wh-btn wh-btn-primary" id="return-confirm">' + icon('check', 16) + ' Conferma reso</button></div>' +
    '</div></div>'
  );
}

function viewHistory() {
  var db = state.db;
  var rows = db.movements.filter(function (m) {
    if (state.historyFilterType !== 'tutti' && m.type !== state.historyFilterType) return false;
    if (state.historyFilterWarehouse !== 'tutti' && m.from !== state.historyFilterWarehouse && m.to !== state.historyFilterWarehouse) return false;
    return true;
  });
  function whName(id) { var w = db.warehouses.find(function (w) { return w.id === id; }); return w ? w.name : '—'; }

  var body = rows.map(function (m) {
    var meta = MOVE_TYPES[m.type] || { label: m.type, cls: '' };
    return (
      '<tr><td><span class="stamp ' + meta.cls + '">' + esc(meta.label) + '</span></td>' +
      '<td><div class="wh-strong">' + esc(m.productName) + '</div><div class="wh-mono wh-dim">' + esc(m.productSku) + '</div></td>' +
      '<td>' + (m.from ? esc(whName(m.from)) : '—') + ' → ' + (m.to ? esc(whName(m.to)) : '—') + '</td>' +
      '<td class="wh-num wh-strong">' + m.qty + '</td>' +
      '<td class="wh-dim">' + esc(m.note || '—') + '</td>' +
      '<td>' + esc(m.user) + '</td>' +
      '<td class="wh-dim">' + fmtDate(m.ts) + '</td></tr>'
    );
  }).join('');
  if (!rows.length) body = '<tr><td colspan="7" class="wh-empty">Nessun movimento registrato.</td></tr>';

  var typeOptions = ['tutti', 'carico', 'scarico', 'trasferimento'].map(function (t) {
    var label = t === 'tutti' ? 'Tutti i tipi' : (t === 'carico' ? 'Solo carichi' : (t === 'scarico' ? 'Solo scarichi' : 'Solo trasferimenti'));
    return '<option value="' + t + '" ' + (state.historyFilterType === t ? 'selected' : '') + '>' + label + '</option>';
  }).join('');
  var whOptions = '<option value="tutti" ' + (state.historyFilterWarehouse === 'tutti' ? 'selected' : '') + '>Tutti i magazzini</option>' +
    db.warehouses.map(function (w) { return '<option value="' + esc(w.id) + '" ' + (state.historyFilterWarehouse === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('');

  return (
    '<div>' +
    openLoansHtml() +
    '<div class="wh-view">' +
    viewHeader('Registro', 'Storico movimenti', 'Tutte le operazioni registrate, con utente e data.') +
    '<div class="wh-filters"><select id="hist-filter-type">' + typeOptions + '</select><select id="hist-filter-wh">' + whOptions + '</select></div>' +
    '<div class="wh-table-wrap"><table class="wh-table"><thead><tr><th>Tipo</th><th>Prodotto</th><th>Da → A</th><th class="wh-num">Quantità</th><th>Nota</th><th>Utente</th><th>Data</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
    '</div>' +
    returnModalHtml() +
    '</div>'
  );
}

/* ------------------------------------------------------------------
   RENDER PRINCIPALE
------------------------------------------------------------------- */
function render() {
  if (!state.authChecked) {
    root.innerHTML = '<div class="wh-root"><div class="wh-center-panel">' + icon('loader', 22, 'wh-spin') + '<p>Verifica sessione…</p></div></div>';
    return;
  }
  if (!state.user) {
    root.innerHTML = viewLogin();
    attachLoginHandlers();
    return;
  }

  var content;
  if (state.dbError) {
    content = '<div class="wh-center-panel">' + icon('warning', 22) + '<p>' + esc(state.dbError) + '</p></div>';
  } else if (!state.db) {
    content = '<div class="wh-center-panel">' + icon('loader', 22, 'wh-spin') + '<p>Caricamento dati magazzino…</p></div>';
  } else if (state.view === 'dashboard') {
    content = viewDashboard();
  } else if (state.view === 'products') {
    content = viewProducts();
  } else if (state.view === 'movement') {
    content = viewMovement();
  } else {
    content = viewHistory();
  }

  var toastHtml = state.toast
    ? '<div class="wh-toast ' + (state.toast.kind === 'error' ? 'wh-toast-error' : '') + '">' + icon(state.toast.kind === 'error' ? 'warning' : 'check', 15) + esc(state.toast.msg) + '</div>'
    : '';

  root.innerHTML = '<div class="wh-root">' + viewTopBar() + '<main class="wh-main">' + content + '</main>' + toastHtml + '</div>';
  attachAppHandlers();
}

/* ------------------------------------------------------------------
   GESTORI EVENTI
------------------------------------------------------------------- */
function attachLoginHandlers() {
  var btn = document.getElementById('login-submit');
  if (btn) btn.addEventListener('click', doLogin);
  ['login-email', 'login-password'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  });
}

function attachAppHandlers() {
  // Navigazione
  document.querySelectorAll('[data-nav]').forEach(function (btn) {
    btn.addEventListener('click', function () { state.view = btn.getAttribute('data-nav'); render(); });
  });
  var logoutBtn = document.getElementById('btn-logout');
  if (logoutBtn) logoutBtn.addEventListener('click', doLogout);

  if (state.view === 'dashboard') attachDashboardHandlers();
  if (state.view === 'products') attachProductsHandlers();
  if (state.view === 'movement') attachMovementHandlers();
  if (state.view === 'history') attachHistoryHandlers();
}

function attachDashboardHandlers() {
  var search = document.getElementById('dash-search');
  if (search) {
    search.addEventListener('input', function () {
      state.dashQuery = search.value;
      document.getElementById('dash-table-wrap').innerHTML = dashboardTableHtml();
    });
  }
}

function attachProductsHandlers() {
  var search = document.getElementById('prod-search');
  if (search) {
    search.addEventListener('input', function () {
      state.prodQuery = search.value;
      document.getElementById('prod-table-wrap').innerHTML = productsTableHtml();
      attachProductRowHandlers();
    });
  }
  attachProductRowHandlers();

  var newBtn = document.getElementById('btn-new-product');
  if (newBtn) newBtn.addEventListener('click', function () { state.editingProduct = 'new'; render(); });

  if (state.editingProduct) attachProductModalHandlers();
  if (state.confirmDeleteProduct) attachConfirmModalHandlers();
}

function attachProductRowHandlers() {
  document.querySelectorAll('[data-edit-product]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-edit-product');
      state.editingProduct = state.db.products.find(function (p) { return p.id === id; }) || null;
      render();
    });
  });
  document.querySelectorAll('[data-delete-product]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-delete-product');
      state.confirmDeleteProduct = state.db.products.find(function (p) { return p.id === id; }) || null;
      render();
    });
  });
}

function attachProductModalHandlers() {
  var closeEls = [document.getElementById('pm-close'), document.getElementById('pm-cancel')];
  closeEls.forEach(function (el) { if (el) el.addEventListener('click', function () { state.editingProduct = null; render(); }); });
  var overlay = document.getElementById('product-modal-overlay');
  if (overlay) overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) { state.editingProduct = null; render(); } });

  var saveBtn = document.getElementById('pm-save');
  if (saveBtn) saveBtn.addEventListener('click', function () {
    var sku = document.getElementById('pm-sku').value.trim();
    var name = document.getElementById('pm-name').value.trim();
    var category = document.getElementById('pm-category').value.trim();
    var price = Number(document.getElementById('pm-price').value) || 0;
    var minStock = Number(document.getElementById('pm-minstock').value) || 0;
    var totalOwned = Number(document.getElementById('pm-totalowned').value) || 0;
    if (!sku || !name) {
      document.getElementById('pm-error').innerHTML = '<div class="wh-login-error">' + icon('warning', 15) + ' SKU e nome sono obbligatori.</div>';
      return;
    }
    var id = saveBtn.getAttribute('data-id') || uid();
    var stockOverrides = {};
    document.querySelectorAll('.pm-stock').forEach(function (input) {
      stockOverrides[input.getAttribute('data-warehouse')] = Number(input.value) || 0;
    });
    state.editingProduct = null;
    upsertProduct({ id: id, sku: sku, name: name, category: category, price: price, minStock: minStock, totalOwned: totalOwned }, stockOverrides);
    render();
  });
}

function attachConfirmModalHandlers() {
  var cancelBtn = document.getElementById('confirm-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', function () { state.confirmDeleteProduct = null; render(); });
  var overlay = document.getElementById('confirm-modal-overlay');
  if (overlay) overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) { state.confirmDeleteProduct = null; render(); } });
  var okBtn = document.getElementById('confirm-ok');
  if (okBtn) okBtn.addEventListener('click', function () {
    var id = state.confirmDeleteProduct.id;
    state.confirmDeleteProduct = null;
    deleteProduct(id);
    render();
  });
}

function attachMovementHandlers() {
  document.querySelectorAll('[data-move-type]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.movementType = btn.getAttribute('data-move-type');
      state.movementCart = [];
      render();
    });
  });
  var productSel = document.getElementById('mv-product');
  function refreshHint() {
    var hintEl = document.getElementById('mv-stock-hint');
    if (hintEl && productSel) hintEl.innerHTML = stockHintHtml(productSel.value);
  }
  if (productSel) productSel.addEventListener('change', refreshHint);

  var addBtn = document.getElementById('mv-add-line');
  if (addBtn) addBtn.addEventListener('click', function () {
    var productId = document.getElementById('mv-product').value;
    var qtyInput = document.getElementById('mv-qty');
    var qty = Number(qtyInput.value);
    if (!productId || !qty || qty <= 0) { showToast('Inserisci una quantità valida', 'error'); return; }
    var product = state.db.products.find(function (p) { return p.id === productId; });
    var existing = state.movementCart.find(function (l) { return l.productId === productId; });
    if (existing) existing.qty += qty;
    else state.movementCart.push({ productId: productId, productName: product.name, qty: qty });
    qtyInput.value = '';
    document.getElementById('mv-cart-wrap').innerHTML = cartLinesHtml();
    attachCartLineHandlers();
    showToast(product.name + ' aggiunto alla lista');
  });

  attachCartLineHandlers();

  var submitBtn = document.getElementById('mv-submit');
  if (submitBtn) submitBtn.addEventListener('click', function () {
    var type = state.movementType;
    var endpoints = {};
    if (type !== 'trasferimento') endpoints.warehouseId = document.getElementById('mv-warehouse').value;
    else { endpoints.fromId = document.getElementById('mv-from').value; endpoints.toId = document.getElementById('mv-to').value; }
    var note = document.getElementById('mv-note').value.trim();

    var lines = state.movementCart.slice();
    // Se la lista è vuota, usa i campi correnti come unica riga
    if (!lines.length) {
      var productId = document.getElementById('mv-product').value;
      var qty = Number(document.getElementById('mv-qty').value);
      if (!productId || !qty || qty <= 0) { showToast('Aggiungi almeno un articolo o inserisci una quantità valida', 'error'); return; }
      lines = [{ productId: productId, qty: qty }];
    }

    submitBtn.disabled = true;
    submitMovementBatch(lines, type, endpoints, note).then(function () {
      state.movementCart = [];
      submitBtn.disabled = false;
      render();
    });
  });
}

function attachCartLineHandlers() {
  document.querySelectorAll('[data-remove-cart-line]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var i = Number(btn.getAttribute('data-remove-cart-line'));
      state.movementCart.splice(i, 1);
      document.getElementById('mv-cart-wrap').innerHTML = cartLinesHtml();
      attachCartLineHandlers();
    });
  });
}

function attachHistoryHandlers() {
  var typeSel = document.getElementById('hist-filter-type');
  var whSel = document.getElementById('hist-filter-wh');
  if (typeSel) typeSel.addEventListener('change', function () { state.historyFilterType = typeSel.value; render(); });
  if (whSel) whSel.addEventListener('change', function () { state.historyFilterWarehouse = whSel.value; render(); });

  document.querySelectorAll('[data-return-loan]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var note = btn.getAttribute('data-return-loan');
      var loan = computeOpenLoans().find(function (l) { return l.note === note; });
      if (!loan) return;
      state.returningLoan = {
        note: loan.note,
        warehouseId: loan.warehouseId,
        items: loan.items.map(function (it) { return { productId: it.productId, name: it.name, qty: it.outstanding }; }),
      };
      render();
    });
  });

  if (state.returningLoan) attachReturnModalHandlers();
}

function attachReturnModalHandlers() {
  var closeEls = [document.getElementById('return-close'), document.getElementById('return-cancel')];
  closeEls.forEach(function (el) { if (el) el.addEventListener('click', function () { state.returningLoan = null; render(); }); });
  var overlay = document.getElementById('return-modal-overlay');
  if (overlay) overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) { state.returningLoan = null; render(); } });

  document.querySelectorAll('[data-return-qty]').forEach(function (input) {
    input.addEventListener('input', function () {
      var i = Number(input.getAttribute('data-return-qty'));
      state.returningLoan.items[i].qty = Number(input.value) || 0;
    });
  });
  document.querySelectorAll('[data-remove-return-line]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var i = Number(btn.getAttribute('data-remove-return-line'));
      state.returningLoan.items.splice(i, 1);
      render();
    });
  });

  var confirmBtn = document.getElementById('return-confirm');
  if (confirmBtn) confirmBtn.addEventListener('click', function () {
    var loan = state.returningLoan;
    var lines = loan.items.filter(function (it) { return it.qty > 0; }).map(function (it) { return { productId: it.productId, qty: it.qty }; });
    if (!lines.length) { showToast('Inserisci almeno una quantità da restituire', 'error'); return; }
    confirmBtn.disabled = true;
    submitMovementBatch(lines, 'carico', { warehouseId: loan.warehouseId }, loan.note).then(function () {
      state.returningLoan = null;
      render();
    });
  });
}

/* ------------------------------------------------------------------
   AVVIO
------------------------------------------------------------------- */
render();
</script>
</body>
</html>
